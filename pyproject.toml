[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "Eigenständige Python-Bibliothek für Prüf- und Normalisierungsfunktionen."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["validkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
